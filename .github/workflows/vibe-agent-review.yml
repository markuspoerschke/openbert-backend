name: Vibe Agent - Review Handler

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# One group across implementation, review, and CI repair workflows.
concurrency:
  group: vibe-agent-${{ github.repository }}
  cancel-in-progress: false

jobs:
  handle-review:
    runs-on: ubuntu-latest
    # Disabled; remove `false &&` to re-enable review handling.
    if: >-
      false &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
      (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) ||
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    env:
      VIBE_API_KEY: ${{ secrets.VIBE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VIBE_GITHUB_TOKEN: ${{ secrets.VIBE_GITHUB_TOKEN }}
      VIBE_MODEL: ${{ secrets.VIBE_MODEL || 'mistral-large-latest' }}
      MAX_RETRIES: ${{ secrets.MAX_RETRIES || '3' }}
      VIBE_TIMEOUT_MINUTES: ${{ secrets.VIBE_TIMEOUT_MINUTES || '30' }}
      VIBE_DEBUG: ${{ secrets.VIBE_DEBUG || 'false' }}
    steps:
      - name: Checkout trusted agent scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.VIBE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Check trusted agent availability
        id: agent
        shell: bash
        run: |
          if [[ -f .github/actions/vibe-agent/action.yml ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vibe agent is not installed on the default branch; skipping this event."
          fi
      - name: Run Vibe Agent
        if: steps.agent.outputs.available == 'true'
        uses: ./.github/actions/vibe-agent
        with:
          mode: review
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
          comment-id: ${{ github.event.comment.id }}
          comment-kind: ${{ github.event_name }}
