name: Vibe Agent - Scheduled

on:
  schedule:
    - cron: '0 * * * *'  # Every hour on the hour
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run in dry-run mode (no commits or PRs)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read
  checks: read

concurrency:
  group: vibe-agent-scheduled
  cancel-in-progress: false

jobs:
  check-and-implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up environment
        run: |
          echo "DRY_RUN=${{ inputs.dry-run || false }}" >> $GITHUB_ENV
          echo "VIBE_AGENT_MODE=scheduled" >> $GITHUB_ENV
          echo "VIBE_TIMEOUT_MINUTES=${{ secrets.VIBE_TIMEOUT_MINUTES || 30 }}" >> $GITHUB_ENV
          echo "MAX_RETRIES=${{ secrets.MAX_RETRIES || 3 }}" >> $GITHUB_ENV
          echo "VIBE_MODEL=${{ secrets.VIBE_MODEL || 'mistral-large-latest' }}" >> $GITHUB_ENV
          echo "VIBE_DEBUG=${{ secrets.VIBE_DEBUG || 'false' }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          # Install jq for JSON processing
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl git > /dev/null 2>&1

      - name: Install Mistral Vibe CLI
        run: |
          curl -fsSL https://vibe.mistral.ai/install.sh | sh
          echo "$(dirname $(which vibe))" >> $GITHUB_PATH
          vibe --version

      - name: Run Vibe Agent
        id: vibe-agent
        env:
          VIBE_API_KEY: ${{ secrets.VIBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Initialize logging
          LOGFILE="/tmp/vibe-agent-$(date +%Y%m%d-%H%M%S).log"
          touch "$LOGFILE"
          exec > >(tee -a "$LOGFILE") 2>&1

          # Source all scripts
          SCRIPT_DIR=".github/actions/vibe-agent"
          source "${SCRIPT_DIR}/common.sh"
          source "${SCRIPT_DIR}/select-issue.sh"
          source "${SCRIPT_DIR}/run-vibe.sh"
          source "${SCRIPT_DIR}/create-pr.sh"
          source "${SCRIPT_DIR}/monitor-ci.sh"
          source "${SCRIPT_DIR}/handle-review.sh"
          source "${SCRIPT_DIR}/lock-manager.sh"

          log_info "Starting scheduled Vibe Agent run"

          # Acquire lock
          if ! acquire_lock; then
            log_info "Another Vibe task is already running. Skipping."
            exit 0
          fi

          # Check for active vibe PRs
          if has_active_vibe_pr; then
            log_info "Active vibe PR exists, skipping scheduled run"
            release_lock
            exit 0
          fi

          # Select an issue
          local issue
          issue=$(select_issue)
          if [[ -z "$issue" ]]; then
            log_info "No actionable issues found"
            release_lock
            exit 0
          fi

          log_info "Selected issue: $issue"
          implement_issue "$issue"

          # Release lock
          release_lock

      - name: Upload logs on failure
        if: failure() && steps.vibe-agent.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: vibe-agent-logs
          path: /tmp/vibe-agent*.log
          retention-days: 7
