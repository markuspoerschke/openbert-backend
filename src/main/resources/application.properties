spring.config.import=optional:file:application-local.properties
spring.application.name=openbert-backend
springdoc.default-produces-media-type=application/json

# Use the public request URL behind the reverse proxy.
server.forward-headers-strategy=framework

# Render REST error responses as RFC 7807 problem+json
spring.mvc.problemdetails.enabled=true

# Crawl scheduler
app.crawl.scheduler.enabled=true
app.crawl.scheduler.cron=0 * * * * *

# Enrichment scheduler
app.enrich.scheduler.enabled=true
app.enrich.scheduler.cron=*/15 * * * * *

# Resolve scheduler
app.resolve.scheduler.enabled=true
app.resolve.scheduler.cron=*/15 * * * * *

# MCP
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=mcp-openbert

# Sentry
#sentry.dsn=https://7f8f2b69fadf4c33b2559d04391659b7@bugsink.openbert.de/2
# sentry.exception-resolver-order=-2147483647

# Swagger
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.urls[0].url=/docs/openapi.json
springdoc.swagger-ui.urls[0].name=Openbert API
springdoc.api-docs.path=/docs/openapi.json

# Actuator
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
