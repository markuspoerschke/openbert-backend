spring.application.name=openbert-backend
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.urls[0].url=/docs/openapi.json
springdoc.swagger-ui.urls[0].name=OpenBERT API
springdoc.api-docs.path=/docs/openapi.json
springdoc.swagger-ui.config-url=/docs/openapi.json
jobrunr.background-job-server.enabled=true
jobrunr.dashboard.enabled=false
jobrunr.dashboard.port=8000

# MCP
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=mcp-openbert

